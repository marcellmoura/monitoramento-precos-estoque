spring.application.name=monitoramento-precos-estoque
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${DB_PORT:5432}/${DB_NAME:monitoramento}}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.path=/
spring.mvc.log-request-details=false
spring.servlet.multipart.max-file-size=${IMPORTACAO_LIMITE_TRANSPORTE_ARQUIVO:12MB}
spring.servlet.multipart.max-request-size=${IMPORTACAO_LIMITE_TRANSPORTE_REQUISICAO:13MB}
app.importacao.pasta=${IMPORTACAO_PASTA:storage/importacoes}
app.importacao.limite-bytes=${IMPORTACAO_LIMITE_BYTES:10485760}
app.importacao.limite-paginas=${IMPORTACAO_LIMITE_PAGINAS:50}
